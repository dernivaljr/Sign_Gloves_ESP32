[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
  adafruit/Adafruit GFX Library @ ^1.11.10
  adafruit/Adafruit SSD1306      @ ^2.5.11
  mpu6050_light                  @ ^1.1.0
  DFRobot/DFRobotDFPlayerMini    @ ^1.0.6
